<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: DIRT PATH TOP                           -->
  <!-- 3D Rectangular Strata Plates with Deepslate-Style Popup Effect            -->
  <!-- ========================================================================= -->

  <!-- Warm Grounded Sunlit Bamboo Ochre Base -->
  <rect width="512" height="512" fill="#d4ae62" />

  <!-- 3D Crevice Drop Shadows (Deepslate-Style +8px Offset) -->
  <g id="crevice_shadows" shape-rendering="crispEdges">
    <rect x="15" y="58" width="300" height="28" fill="#8a6118" opacity="0.95" />
    <rect x="260" y="186" width="225" height="28" fill="#8a6118" opacity="0.95" />
    <rect x="25" y="314" width="150" height="28" fill="#8a6118" opacity="0.95" />
    <!-- Row 4 Toroidal Wrap -->
    <rect x="0" y="442" width="130" height="28" fill="#8a6118" opacity="0.95" />
    <rect x="360" y="442" width="152" height="28" fill="#8a6118" opacity="0.95" />
  </g>

  <!-- Clean Raised Strata Plates (Authentic #edd28c) -->
  <g id="strata_plates" shape-rendering="crispEdges">
    <rect x="15" y="50" width="300" height="28" fill="#edd28c" />
    <rect x="260" y="178" width="225" height="28" fill="#edd28c" />
    <rect x="25" y="306" width="150" height="28" fill="#edd28c" />
    <!-- Row 4 Toroidal Wrap -->
    <rect x="0" y="434" width="130" height="28" fill="#edd28c" />
    <rect x="360" y="434" width="152" height="28" fill="#edd28c" />
  </g>
</svg>
