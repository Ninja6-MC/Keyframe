<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: GRASS BLOCK TOP                         -->
  <!-- Natively rotated 90° (horizontal strokes, zero transform syntax)          -->
  <!-- ========================================================================= -->

  <!-- Warm Sunlit Meadow Green Base -->
  <rect width="512" height="512" fill="#9ac636" />

  <!-- ========================================================================= -->
  <!-- THE 4 HORIZONTAL STROKES (NATIVE COORDINATE ROTATION)                     -->
  <!-- ========================================================================= -->
  <g id="exact-4-grass-strokes" fill="#d2f068" opacity="0.88">
    <!-- Line 1: Row 1 (Y=52), starts left and ends after middle -->
    <rect x="15" y="52" width="300" height="25" rx="9" />

    <!-- Line 2: Row 2 (Y=180), starts after middle and ends before right -->
    <rect x="260" y="180" width="225" height="25" rx="9" />

    <!-- Line 3: Row 3 (Y=308), starts after left and ends before middle -->
    <rect x="25" y="308" width="150" height="25" rx="9" />

    <!-- Line 4: Row 4 (Y=436) - Left Segment (wraps left border X=0 to X=130) -->
    <path
      d="M 0,436 
         v 25 
         h 121 
         a 9,9 0 0 0 9,-9 
         v -7 
         a 9,9 0 0 0 -9,-9 
         Z" />

    <!-- Line 4: Row 4 (Y=436) - Right Segment (starts X=360 to right border X=512) -->
    <path
      d="M 369,436 
         a 9,9 0 0 0 -9,9 
         v 7 
         a 9,9 0 0 0 9,9 
         h 143 
         v -25 
         Z" />
  </g>
</svg>