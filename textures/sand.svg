<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: SAND                                    -->
  <!-- Dual-depth surface:                                                       -->
  <!-- - Dark grains = INSET (recessed dimples with top inner shadow)            -->
  <!-- - Light grains = OUTSET (raised mineral pebbles with bottom cast shadow)  -->
  <!-- ========================================================================= -->

  <!-- 1. Base Warm Beach Sand -->
  <rect width="512" height="512" fill="#dacfa3" />

  <!-- ================================================================== -->
  <!-- 2. DARK GRAINS: INSET SHADOW (Recessed Dimples)                    -->
  <!--    Body: #d1ba8a | Inset Top Shadow: #9e854d | Bottom Bounce: #ddd0a8 -->
  <!-- ================================================================== -->

  <!-- Inset Dimple at (32, 64) -->
  <rect x="32" y="64"  width="32" height="32" fill="#d1ba8a" />
  <rect x="32" y="64"  width="32" height="8"  fill="#9e854d" />
  <rect x="32" y="88"  width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (224, 160) -->
  <rect x="224" y="160" width="32" height="32" fill="#d1ba8a" />
  <rect x="224" y="160" width="32" height="8"  fill="#9e854d" />
  <rect x="224" y="184" width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (384, 224) -->
  <rect x="384" y="224" width="32" height="32" fill="#d1ba8a" />
  <rect x="384" y="224" width="32" height="8"  fill="#9e854d" />
  <rect x="384" y="248" width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (96, 296) -->
  <rect x="96" y="296"  width="32" height="32" fill="#d1ba8a" />
  <rect x="96" y="296"  width="32" height="8"  fill="#9e854d" />
  <rect x="96" y="320"  width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (288, 352) -->
  <rect x="288" y="352" width="32" height="32" fill="#d1ba8a" />
  <rect x="288" y="352" width="32" height="8"  fill="#9e854d" />
  <rect x="288" y="376" width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (0, 384) -->
  <rect x="0" y="384"   width="32" height="32" fill="#d1ba8a" />
  <rect x="0" y="384"   width="32" height="8"  fill="#9e854d" />
  <rect x="0" y="408"   width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (192, 480) -->
  <rect x="192" y="480" width="32" height="32" fill="#d1ba8a" />
  <rect x="192" y="480" width="32" height="8"  fill="#9e854d" />
  <rect x="192" y="504" width="32" height="8"  fill="#ddd0a8" />

  <!-- Inset Dimple at (480, 448) -->
  <rect x="480" y="448" width="32" height="32" fill="#d1ba8a" />
  <rect x="480" y="448" width="32" height="8"  fill="#9e854d" />
  <rect x="480" y="472" width="32" height="8"  fill="#ddd0a8" />

  <!-- ================================================================== -->
  <!-- 3. LIGHT GRAINS: OUTSET SHADOW (Raised Mineral Pebbles)            -->
  <!--    Cast Shadow: #a8935c (downward offset +8px) | Body: #e7e4bb      -->
  <!-- ================================================================== -->

  <!-- Outset Drop Shadows (underneath raised light grains) -->
  <g id="outset_pebble_shadows" fill="#a8935c" shape-rendering="crispEdges">
    <rect x="416" y="8"   width="32" height="32" />
    <rect x="256" y="40"  width="32" height="32" />
    <rect x="480" y="72"  width="32" height="32" />
    <rect x="128" y="136" width="32" height="32" />
    <rect x="320" y="200" width="32" height="32" />
    <rect x="160" y="232" width="32" height="32" />
    <rect x="448" y="304" width="32" height="32" />
    <rect x="288" y="392" width="32" height="32" />
  </g>

  <!-- Raised Light Pebble Bodies -->
  <g id="outset_pebble_bodies" fill="#e7e4bb" shape-rendering="crispEdges">
    <rect x="416" y="0"   width="32" height="32" />
    <rect x="256" y="32"  width="32" height="32" />
    <rect x="480" y="64"  width="32" height="32" />
    <rect x="128" y="128" width="32" height="32" />
    <rect x="320" y="192" width="32" height="32" />
    <rect x="160" y="224" width="32" height="32" />
    <rect x="448" y="296" width="32" height="32" />
    <rect x="288" y="384" width="32" height="32" />
  </g>
</svg>
