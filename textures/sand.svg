<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: SAND                                    -->
  <!-- Warm beach sand with recessed mineral grains (inset 3D shadow)            -->
  <!-- Each grain is a concave dimple: dark top-band, grain body, lit bottom-band -->
  <!-- ========================================================================= -->

  <!-- 1. Base Warm Beach Sand -->
  <rect width="512" height="512" fill="#dacfa3" />

  <!-- ================================================================== -->
  <!-- 2. SHADED GRAINS — warm tan recessed flecks                        -->
  <!--    Body: #d1ba8a | Inset shadow (top): #b89d66 | Highlight (bot): #ddd0a8 -->
  <!-- ================================================================== -->

  <!-- Grain at (32, 64) -->
  <rect x="32" y="64"  width="32" height="32" fill="#d1ba8a" />
  <rect x="32" y="64"  width="32" height="8"  fill="#b89d66" />
  <rect x="32" y="88"  width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (224, 160) -->
  <rect x="224" y="160" width="32" height="32" fill="#d1ba8a" />
  <rect x="224" y="160" width="32" height="8"  fill="#b89d66" />
  <rect x="224" y="184" width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (384, 224) -->
  <rect x="384" y="224" width="32" height="32" fill="#d1ba8a" />
  <rect x="384" y="224" width="32" height="8"  fill="#b89d66" />
  <rect x="384" y="248" width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (96, 296) -->
  <rect x="96" y="296"  width="32" height="32" fill="#d1ba8a" />
  <rect x="96" y="296"  width="32" height="8"  fill="#b89d66" />
  <rect x="96" y="320"  width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (288, 352) -->
  <rect x="288" y="352" width="32" height="32" fill="#d1ba8a" />
  <rect x="288" y="352" width="32" height="8"  fill="#b89d66" />
  <rect x="288" y="376" width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (0, 384) -->
  <rect x="0" y="384"   width="32" height="32" fill="#d1ba8a" />
  <rect x="0" y="384"   width="32" height="8"  fill="#b89d66" />
  <rect x="0" y="408"   width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (192, 480) -->
  <rect x="192" y="480" width="32" height="32" fill="#d1ba8a" />
  <rect x="192" y="480" width="32" height="8"  fill="#b89d66" />
  <rect x="192" y="504" width="32" height="8"  fill="#ddd0a8" />

  <!-- Grain at (480, 448) -->
  <rect x="480" y="448" width="32" height="32" fill="#d1ba8a" />
  <rect x="480" y="448" width="32" height="8"  fill="#b89d66" />
  <rect x="480" y="472" width="32" height="8"  fill="#ddd0a8" />

  <!-- ================================================================== -->
  <!-- 3. HIGHLIGHT GRAINS — pale sparkling mineral flecks                -->
  <!--    Body: #e7e4bb | Inset shadow (top): #c8b982 | Highlight (bot): #f0edd0 -->
  <!-- ================================================================== -->

  <!-- Grain at (416, 0) -->
  <rect x="416" y="0"   width="32" height="32" fill="#e7e4bb" />
  <rect x="416" y="0"   width="32" height="8"  fill="#c8b982" />
  <rect x="416" y="24"  width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (256, 32) -->
  <rect x="256" y="32"  width="32" height="32" fill="#e7e4bb" />
  <rect x="256" y="32"  width="32" height="8"  fill="#c8b982" />
  <rect x="256" y="56"  width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (480, 64) -->
  <rect x="480" y="64"  width="32" height="32" fill="#e7e4bb" />
  <rect x="480" y="64"  width="32" height="8"  fill="#c8b982" />
  <rect x="480" y="88"  width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (128, 128) -->
  <rect x="128" y="128" width="32" height="32" fill="#e7e4bb" />
  <rect x="128" y="128" width="32" height="8"  fill="#c8b982" />
  <rect x="128" y="152" width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (320, 192) -->
  <rect x="320" y="192" width="32" height="32" fill="#e7e4bb" />
  <rect x="320" y="192" width="32" height="8"  fill="#c8b982" />
  <rect x="320" y="216" width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (160, 224) -->
  <rect x="160" y="224" width="32" height="32" fill="#e7e4bb" />
  <rect x="160" y="224" width="32" height="8"  fill="#c8b982" />
  <rect x="160" y="248" width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (448, 296) -->
  <rect x="448" y="296" width="32" height="32" fill="#e7e4bb" />
  <rect x="448" y="296" width="32" height="8"  fill="#c8b982" />
  <rect x="448" y="320" width="32" height="8"  fill="#f0edd0" />

  <!-- Grain at (288, 384) -->
  <rect x="288" y="384" width="32" height="32" fill="#e7e4bb" />
  <rect x="288" y="384" width="32" height="8"  fill="#c8b982" />
  <rect x="288" y="408" width="32" height="8"  fill="#f0edd0" />
</svg>
