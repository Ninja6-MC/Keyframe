<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: SAND                                    -->
  <!-- Warm Sunlit Golden-Yellow Sand Base with Exact 1:1 Pixel-Matched Dots     -->
  <!-- ========================================================================= -->

  <!-- Rich Warm Yellowish Sand Base (#e2c468) -->
  <rect width="512" height="512" fill="#e2c468" />

  <!-- ========================================================================= -->
  <!-- 1:1 MATCHED WARM SUNLIT LIGHT DOTS (#f4df92)                              -->
  <!-- ========================================================================= -->
  <g id="sand-light-dots" fill="#f4df92">
    <!-- Top-Left Edge (X=3, Y=0) -->
    <rect x="96" y="0" width="32" height="32" />

    <!-- Upper-Left (X=1, Y=3) -->
    <rect x="32" y="96" width="32" height="32" />

    <!-- Upper-Left-Center (X=4, Y=3) -->
    <rect x="128" y="96" width="32" height="32" />

    <!-- Center-Left (X=5, Y=8) -->
    <rect x="160" y="256" width="32" height="32" />

    <!-- Lower-Center (X=7, Y=10) -->
    <rect x="224" y="320" width="32" height="32" />

    <!-- Lower-Left (X=1, Y=12) -->
    <rect x="32" y="384" width="32" height="32" />

    <!-- Lower-Right (X=11, Y=12) -->
    <rect x="352" y="384" width="32" height="32" />

    <!-- Bottom-Center (X=6, Y=14) -->
    <rect x="192" y="448" width="32" height="32" />
  </g>

  <!-- ========================================================================= -->
  <!-- 1:1 MATCHED WARM GOLDEN DARK DOTS (#c69e40)                               -->
  <!-- ========================================================================= -->
  <g id="sand-dark-dots" fill="#c69e40">
    <!-- Top-Left (X=3, Y=1) -->
    <rect x="96" y="32" width="32" height="32" />

    <!-- Top-Right (X=9, Y=1) -->
    <rect x="288" y="32" width="32" height="32" />

    <!-- Mid-Left (X=5, Y=6) -->
    <rect x="160" y="192" width="32" height="32" />

    <!-- Mid-Right (X=12, Y=6) -->
    <rect x="384" y="192" width="32" height="32" />

    <!-- Center-Right (X=9, Y=8) -->
    <rect x="288" y="256" width="32" height="32" />

    <!-- Left Border Edge (X=0, Y=11) -->
    <rect x="0" y="352" width="32" height="32" />

    <!-- Lower-Right (X=13, Y=13) -->
    <rect x="416" y="416" width="32" height="32" />
  </g>
</svg>
