<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. Deep Primordial Mantle Crust Base -->
  <rect width="512" height="512" fill="#141414" />

  <!-- 2. Dark Crevice Fault Channels -->
  <g fill="#080808">
    <rect x="32" y="64" width="160" height="96" rx="12" />
    <rect x="0" y="256" width="128" height="96" rx="12" />
    <rect x="384" y="0" width="128" height="96" rx="12" />
    <rect x="256" y="160" width="160" height="96" rx="12" />
    <rect x="320" y="320" width="192" height="96" rx="12" />
    <rect x="96" y="384" width="160" height="128" rx="12" />
  </g>

  <!-- 3. Mid-Slate Metamorphic Tectonic Plates (Previous Beloved Shape Structure) -->
  <g fill="#3e3e3e">
    <!-- Plate Alpha (Top Left Toroidal, wraps y=0 and y=512) -->
    <path d="M 0 0 L 160 0 L 160 64 L 64 64 L 64 160 L 0 160 Z" />
    <path d="M 0 448 L 64 448 L 64 512 L 0 512 Z" />
    <path d="M 448 448 L 512 448 L 512 512 L 448 512 Z" />
    <path d="M 448 0 L 512 0 L 512 64 L 448 64 Z" />

    <!-- Plate Beta (Top Center / Right) -->
    <path d="M 224 0 L 416 0 L 416 96 L 352 96 L 352 160 L 224 160 Z" />

    <!-- Plate Gamma (Center Massive Rock) -->
    <path d="M 128 128 L 288 128 L 288 192 L 352 192 L 352 320 L 224 320 L 224 256 L 128 256 Z" />

    <!-- Plate Delta (Mid Left) -->
    <path d="M 0 192 L 96 192 L 96 288 L 0 288 Z" />

    <!-- Plate Epsilon (Right Toroidal, wraps x=512 and x=0) -->
    <path d="M 416 160 L 512 160 L 512 320 L 448 320 L 448 256 L 416 256 Z" />
    <path d="M 0 160 L 32 160 L 32 256 L 0 256 Z" />

    <!-- Plate Zeta (Bottom Left) -->
    <path d="M 32 320 L 192 320 L 192 448 L 96 448 L 96 480 L 32 480 Z" />

    <!-- Plate Eta (Bottom Center / Right) -->
    <path d="M 256 320 L 384 320 L 384 416 L 480 416 L 480 512 L 256 512 Z" />
  </g>

  <!-- 4. Raised Slate Cores & Inner Chamfers -->
  <g fill="#545454">
    <rect x="16" y="16" width="112" height="96" rx="8" />
    <rect x="256" y="16" width="128" height="64" rx="8" />
    <rect x="160" y="144" width="112" height="96" rx="8" />
    <rect x="256" y="208" width="80" height="96" rx="8" />
    <rect x="16" y="208" width="64" height="64" rx="8" />
    <rect x="448" y="176" width="48" height="128" rx="8" />
    <rect x="48" y="336" width="128" height="96" rx="8" />
    <rect x="288" y="336" width="80" height="80" rx="8" />
    <rect x="288" y="432" width="160" height="64" rx="8" />
    <rect x="464" y="464" width="48" height="48" rx="6" />
    <rect x="464" y="0" width="48" height="48" rx="6" />
  </g>

  <!-- 5. High-Contrast Mineral Highlights (Bright & Crisp) -->
  <g fill="#a8a8a8">
    <rect x="32" y="32" width="80" height="32" rx="4" />
    <rect x="288" y="32" width="80" height="32" rx="4" />
    <rect x="176" y="160" width="80" height="32" rx="4" />
    <rect x="272" y="224" width="48" height="48" rx="4" />
    <rect x="32" y="224" width="32" height="32" rx="4" />
    <rect x="464" y="192" width="32" height="80" rx="4" />
    <rect x="64" y="352" width="96" height="32" rx="4" />
    <rect x="304" y="352" width="48" height="48" rx="4" />
    <rect x="320" y="448" width="96" height="32" rx="4" />
    <rect x="480" y="480" width="32" height="32" rx="4" />
    <rect x="480" y="0" width="32" height="32" rx="4" />
  </g>

  <!-- 6. Crisp Bright Specular Glints -->
  <g fill="#dedede">
    <rect x="48" y="36" width="48" height="12" rx="2" />
    <rect x="304" y="36" width="48" height="12" rx="2" />
    <rect x="192" y="164" width="48" height="12" rx="2" />
    <rect x="280" y="228" width="24" height="24" rx="2" />
    <rect x="472" y="200" width="16" height="48" rx="2" />
    <rect x="80" y="356" width="64" height="12" rx="2" />
    <rect x="336" y="452" width="64" height="12" rx="2" />
  </g>
</svg>
