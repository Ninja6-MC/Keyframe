<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: COBBLESTONE                             -->
  <!-- 3-Tier Stepped Rounded Cobblestone Boulders with Varied/Randomized Sizes  -->
  <!-- ========================================================================= -->

  <!-- Deep Dark Mortar Matrix Base (#34373d) -->
  <rect width="512" height="512" fill="#34373d" />

  <!-- ========================================================================= -->
  <!-- 3-TIER STEPPED CIRCULAR COBBLESTONES (#626970)                            -->
  <!-- ========================================================================= -->
  <g id="cobblestone-circles" fill="#626970">
    <!-- =======================================================
         ROW 1: TOP CIRCLES (Y = 0..128) - USER CONFIRMED PERFECT
         ======================================================= -->
    <!-- 1. Top-Left Circle (Medium 4x4) -->
    <rect x="32" y="0" width="64" height="32" />
    <rect x="0" y="32" width="128" height="64" />
    <rect x="32" y="96" width="64" height="32" />

    <!-- 2. Top-Center Circle (Large 6x4) -->
    <rect x="192" y="0" width="128" height="32" />
    <rect x="160" y="32" width="192" height="64" />
    <rect x="192" y="96" width="128" height="32" />

    <!-- 3. Top-Right Circle (Medium 4x4) -->
    <rect x="416" y="0" width="64" height="32" />
    <rect x="384" y="32" width="128" height="64" />
    <rect x="416" y="96" width="64" height="32" />

    <!-- =======================================================
         ROW 2: UPPER-MID CIRCLES (Y = 128..256) - STAGGERED & RANDOMIZED
         ======================================================= -->
    <!-- 4. Upper-Mid Left Circle (Medium 4x4) -->
    <rect x="128" y="128" width="64" height="32" />
    <rect x="96" y="160" width="128" height="64" />
    <rect x="128" y="224" width="64" height="32" />

    <!-- 5. Upper-Mid Right Circle (Medium-Large 6x4) -->
    <rect x="288" y="128" width="128" height="32" />
    <rect x="256" y="160" width="192" height="64" />
    <rect x="288" y="224" width="128" height="32" />

    <!-- 6. Upper-Mid Border Wrap Circle (Small 3x4) -->
    <rect x="0" y="128" width="32" height="32" />
    <rect x="0" y="160" width="64" height="64" />
    <rect x="0" y="224" width="32" height="32" />
    <rect x="480" y="128" width="32" height="32" />
    <rect x="480" y="160" width="32" height="64" />
    <rect x="480" y="224" width="32" height="32" />

    <!-- =======================================================
         ROW 3: LOWER-MID CIRCLES (Y = 256..384) - STAGGERED & RANDOMIZED
         ======================================================= -->
    <!-- 7. Lower-Mid Left Circle (Small 3x4) -->
    <rect x="32" y="256" width="32" height="32" />
    <rect x="0" y="288" width="96" height="64" />
    <rect x="32" y="352" width="32" height="32" />

    <!-- 8. Signature Center Hero Boulder (Large 7x4) -->
    <rect x="160" y="256" width="160" height="32" />
    <rect x="128" y="288" width="224" height="64" />
    <rect x="160" y="352" width="160" height="32" />

    <!-- 9. Lower-Mid Right Circle (Medium 4x4) -->
    <rect x="416" y="256" width="64" height="32" />
    <rect x="384" y="288" width="128" height="64" />
    <rect x="416" y="352" width="64" height="32" />

    <!-- =======================================================
         ROW 4: BOTTOM CIRCLES (Y = 384..512) - STAGGERED & RANDOMIZED
         ======================================================= -->
    <!-- 10. Bottom Left-Center Circle (Medium-Large 6x4) -->
    <rect x="96" y="384" width="128" height="32" />
    <rect x="64" y="416" width="192" height="64" />
    <rect x="96" y="480" width="128" height="32" />

    <!-- 11. Bottom Right-Center Circle (Medium 4x4) -->
    <rect x="320" y="384" width="64" height="32" />
    <rect x="288" y="416" width="128" height="64" />
    <rect x="320" y="480" width="64" height="32" />

    <!-- 12. Bottom Border Wrap Circle (Small 3x4) -->
    <rect x="0" y="384" width="32" height="32" />
    <rect x="0" y="416" width="32" height="64" />
    <rect x="0" y="480" width="32" height="32" />
    <rect x="480" y="384" width="32" height="32" />
    <rect x="448" y="416" width="64" height="64" />
    <rect x="480" y="480" width="32" height="32" />
  </g>
</svg>
