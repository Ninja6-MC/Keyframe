<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: BALANCED GRAVEL BED                     -->
  <!-- Uniform multi-scale pebble distribution across all 16 rows including top  -->
  <!-- ========================================================================= -->

  <defs>
    <!-- Radial Transparency Gradient Mask (Center to Edge) -->
    <mask id="radial_transparency_mask">
      <radialGradient id="brush_fade_grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.60" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45" />
      </radialGradient>
      <rect width="512" height="512" fill="url(#brush_fade_grad)" />
    </mask>
    <!-- 1. 1x1 Light Quartz Pebble (32x32) -->
    <g id="p_light" shape-rendering="crispEdges">
      <rect y="29" width="32" height="3" fill="#3e3a42" />
      <rect x="29" width="3" height="32" fill="#3e3a42" />
      <rect width="29" height="29" fill="#c0bcc8" />
      <rect width="29" height="3" fill="#eae6f2" />
      <rect width="3" height="29" fill="#eae6f2" />
    </g>

    <!-- 2. 1x1 Medium Slate Pebble (32x32) -->
    <g id="p_med" shape-rendering="crispEdges">
      <rect y="29" width="32" height="3" fill="#3e3a42" />
      <rect x="29" width="3" height="32" fill="#3e3a42" />
      <rect width="29" height="29" fill="#6c6772" />
      <rect width="29" height="3" fill="#908b96" />
      <rect width="3" height="29" fill="#908b96" />
    </g>

    <!-- 3. 1x1 Dark Recessed Slate Dimple (32x32) -->
    <g id="p_dark" shape-rendering="crispEdges">
      <rect width="32" height="32" fill="#46414c" />
      <rect width="32" height="3" fill="#2c2830" />
      <rect width="3" height="32" fill="#2c2830" />
      <rect y="29" width="32" height="3" fill="#726d78" />
      <rect x="29" width="3" height="32" fill="#726d78" />
    </g>

    <!-- 4. 2x1 Horizontal Light Stone (64x32) -->
    <g id="p_oblong_light" shape-rendering="crispEdges">
      <rect y="29" width="64" height="3" fill="#3e3a42" />
      <rect x="61" width="3" height="32" fill="#3e3a42" />
      <rect width="61" height="29" fill="#c0bcc8" />
      <rect width="61" height="3" fill="#eae6f2" />
      <rect width="3" height="29" fill="#eae6f2" />
    </g>

    <!-- 5. 2x1 Horizontal Medium Stone (64x32) -->
    <g id="p_oblong_med" shape-rendering="crispEdges">
      <rect y="29" width="64" height="3" fill="#3e3a42" />
      <rect x="61" width="3" height="32" fill="#3e3a42" />
      <rect width="61" height="29" fill="#6c6772" />
      <rect width="61" height="3" fill="#908b96" />
      <rect width="3" height="29" fill="#908b96" />
    </g>

    <!-- 6. 1x2 Vertical Medium Stone (32x64) -->
    <g id="p_vert_med" shape-rendering="crispEdges">
      <rect y="61" width="32" height="3" fill="#3e3a42" />
      <rect x="29" width="3" height="64" fill="#3e3a42" />
      <rect width="29" height="61" fill="#6c6772" />
      <rect width="29" height="3" fill="#908b96" />
      <rect width="3" height="61" fill="#908b96" />
    </g>

    <!-- 7. 1x2 Vertical Light Stone (32x64) -->
    <g id="p_vert_light" shape-rendering="crispEdges">
      <rect y="61" width="32" height="3" fill="#3e3a42" />
      <rect x="29" width="3" height="64" fill="#3e3a42" />
      <rect width="29" height="61" fill="#c0bcc8" />
      <rect width="29" height="3" fill="#eae6f2" />
      <rect width="3" height="61" fill="#eae6f2" />
    </g>

    <!-- 8. Micro Mineral Chips (16x16) -->
    <g id="f_light" shape-rendering="crispEdges">
      <rect y="14" width="16" height="2" fill="#3e3a42" />
      <rect x="14" width="2" height="16" fill="#3e3a42" />
      <rect width="14" height="14" fill="#c0bcc8" />
      <rect width="14" height="2" fill="#eae6f2" />
      <rect width="2" height="14" fill="#eae6f2" />
    </g>

    <g id="f_dark" shape-rendering="crispEdges">
      <rect width="16" height="16" fill="#46414c" />
      <rect width="16" height="2" fill="#2c2830" />
      <rect width="2" height="16" fill="#2c2830" />
      <rect y="14" width="16" height="2" fill="#726d78" />
      <rect x="14" width="2" height="16" fill="#726d78" />
    </g>
  </defs>

  <!-- 1. Warm Earthy Slate Bed Base -->
  <rect width="512" height="512" fill="#807b85" />
  <g id="radial-swept-pebbles" mask="url(#radial_transparency_mask)">

  <!-- 2. Medium & Oblong Slate River Stones -->
  <!-- Top Row & Upper Sector (Densely Populated) -->
  <use href="#p_oblong_med" x="96" y="0" />
  <use href="#p_vert_med" x="64" y="64" />
  <use href="#p_med" x="96" y="32" />
  <use href="#p_oblong_med" x="224" y="32" />
  <use href="#p_med" x="448" y="32" />
  <use href="#p_oblong_light" x="384" y="64" />
  <use href="#p_med" x="160" y="64" />
  <use href="#p_vert_med" x="288" y="96" />
  <use href="#p_med" x="352" y="0" />

  <!-- Mid-Top Sector -->
  <use href="#p_oblong_med" x="96" y="160" />
  <use href="#p_med" x="128" y="192" />
  <use href="#p_vert_med" x="32" y="96" />
  <use href="#p_med" x="224" y="128" />
  <use href="#p_med" x="448" y="160" />
  <use href="#p_med" x="416" y="192" />

  <!-- Center Sector -->
  <use href="#p_oblong_light" x="128" y="192" />
  <use href="#p_med" x="160" y="320" />
  <use href="#p_oblong_med" x="320" y="160" />
  <use href="#p_vert_med" x="352" y="160" />
  <use href="#p_med" x="128" y="256" />

  <!-- Mid-Bottom Sector -->
  <use href="#p_oblong_light" x="64" y="288" />
  <use href="#p_med" x="128" y="288" />
  <use href="#p_vert_med" x="224" y="320" />
  <use href="#p_med" x="272" y="368" />
  <use href="#p_oblong_med" x="384" y="288" />
  <use href="#p_med" x="448" y="320" />

  <!-- Bottom Sector -->
  <use href="#p_oblong_med" x="96" y="416" />
  <use href="#p_vert_med" x="160" y="352" />
  <use href="#p_oblong_light" x="288" y="416" />
  <use href="#p_med" x="320" y="448" />
  <use href="#p_vert_light" x="352" y="352" />
  <use href="#p_med" x="416" y="384" />
  <use href="#p_oblong_med" x="32" y="352" />

  <!-- 3. Light Quartz Pebbles (Including Top Row Highlights) -->
  <use href="#p_light" x="0" y="0" />
  <use href="#p_light" x="256" y="0" />
  <use href="#p_light" x="64" y="32" />
  <use href="#p_light" x="288" y="32" />
  <use href="#p_light" x="352" y="32" />
  <use href="#p_light" x="192" y="96" />
  <use href="#p_light" x="448" y="96" />

  <use href="#p_light" x="160" y="160" />
  <use href="#p_light" x="272" y="112" />
  <use href="#p_light" x="416" y="160" />
  <use href="#p_light" x="32" y="192" />
  <use href="#p_light" x="352" y="224" />

  <use href="#p_light" x="160" y="320" />
  <use href="#p_light" x="288" y="320" />
  <use href="#p_light" x="352" y="288" />
  <use href="#p_light" x="384" y="320" />
  <use href="#p_light" x="96" y="352" />

  <use href="#p_light" x="64" y="416" />
  <use href="#p_light" x="160" y="416" />
  <use href="#p_light" x="224" y="448" />
  <use href="#p_light" x="448" y="384" />
  <use href="#p_light" x="384" y="448" />

  <!-- 4. Dark Recessed Dimples & Shadow Cavities -->
  <use href="#p_dark" x="384" y="0" />
  <use href="#p_dark" x="96" y="96" />
  <use href="#p_dark" x="256" y="64" />
  <use href="#p_dark" x="352" y="64" />
  <use href="#p_dark" x="416" y="32" />
  <use href="#p_dark" x="128" y="128" />

  <use href="#p_dark" x="64" y="160" />
  <use href="#p_dark" x="320" y="160" />
  <use href="#p_dark" x="384" y="192" />
  <use href="#p_dark" x="320" y="160" />
  <use href="#p_dark" x="448" y="224" />

  <use href="#p_dark" x="32" y="288" />
  <use href="#p_dark" x="96" y="320" />
  <use href="#p_dark" x="256" y="352" />
  <use href="#p_dark" x="416" y="320" />
  <use href="#p_dark" x="320" y="288" />

  <use href="#p_dark" x="64" y="448" />
  <use href="#p_dark" x="128" y="384" />
  <use href="#p_dark" x="256" y="416" />
  <use href="#p_dark" x="416" y="416" />
  <use href="#p_dark" x="352" y="416" />

  <!-- 5. Micro Mineral Chips -->
  <use href="#f_light" x="32" y="32" />
  <use href="#f_dark" x="128" y="64" />
  <use href="#f_light" x="160" y="32" />
  <use href="#f_dark" x="192" y="32" />
  <use href="#f_light" x="320" y="32" />
  <use href="#f_dark" x="416" y="96" />
  <use href="#f_light" x="480" y="0" />

  <use href="#f_light" x="32" y="160" />
  <use href="#f_dark" x="64" y="128" />
  <use href="#f_light" x="160" y="128" />
  <use href="#f_dark" x="192" y="160" />
  <use href="#f_light" x="288" y="160" />
  <use href="#f_dark" x="320" y="96" />
  <use href="#f_light" x="416" y="128" />

  <use href="#f_dark" x="32" y="224" />
  <use href="#f_light" x="64" y="224" />
  <use href="#f_dark" x="96" y="256" />
  <use href="#f_light" x="160" y="224" />
  <use href="#f_dark" x="352" y="272" />
  <use href="#f_light" x="368" y="208" />
  <use href="#f_dark" x="384" y="256" />
  <use href="#f_light" x="448" y="256" />

  <use href="#f_light" x="32" y="320" />
  <use href="#f_dark" x="160" y="320" />
  <use href="#f_light" x="192" y="352" />
  <use href="#f_dark" x="288" y="352" />
  <use href="#f_light" x="320" y="320" />
  <use href="#f_dark" x="384" y="352" />
  <use href="#f_light" x="448" y="352" />

  <use href="#f_dark" x="32" y="448" />
  <use href="#f_light" x="96" y="480" />
  <use href="#f_dark" x="192" y="416" />
  <use href="#f_light" x="256" y="480" />
  <use href="#f_dark" x="288" y="448" />
  <use href="#f_light" x="384" y="480" />
  <use href="#f_dark" x="448" y="448" />

  <!-- ==================== TOROIDAL SEAM WRAPPING ==================== -->
  <!-- Left/Right Border Wraps -->
  <use href="#p_oblong_med" x="-32" y="128" />
  <use href="#p_oblong_med" x="480" y="128" />

  <use href="#p_light" x="-32" y="224" />
  <use href="#p_light" x="480" y="224" />
  <use href="#p_dark" x="-32" y="256" />
  <use href="#p_dark" x="480" y="256" />

  <use href="#p_vert_med" x="-16" y="352" />
  <use href="#p_vert_med" x="496" y="352" />

  <use href="#p_light" x="-32" y="64" />
  <use href="#p_light" x="480" y="64" />

  <use href="#p_dark" x="-32" y="416" />
  <use href="#p_dark" x="480" y="416" />

  <!-- Top/Bottom Border Wraps -->
  <use href="#p_oblong_med" x="96" y="512" />
  <use href="#p_med" x="352" y="512" />
  <use href="#p_light" x="256" y="512" />
  <use href="#p_dark" x="384" y="512" />

  <use href="#p_light" x="160" y="-32" />
  <use href="#p_light" x="160" y="480" />
  <use href="#p_dark" x="192" y="-32" />
  <use href="#p_dark" x="192" y="480" />

  <use href="#p_oblong_light" x="352" y="-32" />
  <use href="#p_oblong_light" x="352" y="480" />
  <use href="#p_med" x="416" y="-32" />
  <use href="#p_med" x="416" y="480" />

  <use href="#p_med" x="64" y="-32" />
  <use href="#p_med" x="64" y="480" />

  <!-- Corner Wrap (all 4 corners) -->
  <use href="#p_light" x="512" y="0" />
  <use href="#p_light" x="0" y="512" />
  <use href="#p_light" x="512" y="512" />

  <use href="#p_med" x="-16" y="-16" />
  <use href="#p_med" x="496" y="-16" />
  <use href="#p_med" x="-16" y="496" />
  <use href="#p_med" x="496" y="496" />
  </g>
</svg>