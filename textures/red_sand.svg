  <!-- 3. HIGHLIGHT GRAINS — golden terracotta recessed flecks            -->
  <!--    Body: #d2752b | Inset shadow (top): #9d4c10 | Highlight (bot): #de8a42 -->
  <!-- ================================================================== -->

  <!-- Grain at (416, 0) -->
  <rect x="416" y="0"   width="32" height="32" fill="#d2752b" />
  <rect x="416" y="0"   width="32" height="8"  fill="#9d4c10" />
  <rect x="416" y="24"  width="32" height="8"  fill="#de8a42" />

