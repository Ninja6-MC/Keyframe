  <rect x="448" y="320" width="32" height="8"  fill="#de8a42" />

  <!-- Grain at (288, 384) -->
  <rect x="288" y="384" width="32" height="32" fill="#d2752b" />
  <rect x="288" y="384" width="32" height="8"  fill="#9d4c10" />
  <rect x="288" y="408" width="32" height="8"  fill="#de8a42" />
</svg>
