<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: RED SAND (BADLANDS / MESA)              -->
  <!-- Terracotta sand with recessed mineral grains (inset 3D shadow)            -->
  <!-- Each grain is a concave dimple: dark top-band, grain body, lit bottom-band -->
  <!-- ========================================================================= -->

  <!-- 1. Base Badlands Terracotta Red -->
  <rect width="512" height="512" fill="#bf6721" />

  <!-- ================================================================== -->
  <!-- 2. SHADED GRAINS — deep clay recessed flecks                       -->
  <!--    Body: #ac5712 | Inset shadow (top): #8c3e07 | Highlight (bot): #b86520 -->
  <!-- ================================================================== -->

  <!-- Grain at (32, 64) -->
  <rect x="32" y="64"  width="32" height="32" fill="#ac5712" />
  <rect x="32" y="64"  width="32" height="8"  fill="#8c3e07" />
  <rect x="32" y="88"  width="32" height="8"  fill="#b86520" />

  <!-- Grain at (224, 160) -->
  <rect x="224" y="160" width="32" height="32" fill="#ac5712" />
  <rect x="224" y="160" width="32" height="8"  fill="#8c3e07" />
  <rect x="224" y="184" width="32" height="8"  fill="#b86520" />

  <!-- Grain at (384, 224) -->
  <rect x="384" y="224" width="32" height="32" fill="#ac5712" />
  <rect x="384" y="224" width="32" height="8"  fill="#8c3e07" />
  <rect x="384" y="248" width="32" height="8"  fill="#b86520" />

  <!-- Grain at (96, 296) -->
  <rect x="96" y="296"  width="32" height="32" fill="#ac5712" />
