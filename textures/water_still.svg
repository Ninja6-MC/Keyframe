<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radiant BSL Sky-Blue Surface Gradient -->
    <linearGradient id="bsl_water_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4deeea" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#38d5ec" stop-opacity="0.40" />
    </linearGradient>

    <!-- Sunlit Luminous Sheen Layer -->
    <radialGradient id="caustic_bsl_1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#d8fbff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38d5ec" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="caustic_bsl_2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#d8fbff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38d5ec" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Base Radiant BSL Aqua Sky-Blue Volume -->
  <rect width="512" height="512" fill="url(#bsl_water_grad)" />

  <!-- Soft Toroidal Rolling Wave Swells -->
  <path d="M 0 160 C 128 110, 256 190, 384 140 C 448 115, 480 135, 512 160 L 512 210 C 480 185, 448 165, 384 190 C 256 240, 128 160, 0 210 Z" fill="url(#caustic_bsl_1)" />
  <path d="M 0 390 C 128 340, 256 420, 384 370 C 448 345, 480 365, 512 390 L 512 440 C 480 415, 448 395, 384 420 C 256 470, 128 390, 0 440 Z" fill="url(#caustic_bsl_2)" />

  <!-- Diffuse Sunlit Shimmer Patches -->
  <ellipse cx="160" cy="120" rx="100" ry="55" fill="url(#caustic_bsl_1)" />
  <ellipse cx="400" cy="270" rx="110" ry="60" fill="url(#caustic_bsl_2)" />
  <ellipse cx="200" cy="420" rx="105" ry="55" fill="url(#caustic_bsl_1)" />
</svg>
