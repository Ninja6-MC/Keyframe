<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle Ambient Reflection Gradient -->
    <linearGradient id="reflect_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ebf2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#b6b6b6" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Base Translucent Calm Aquatic Volume -->
  <rect width="512" height="512" fill="#b6b6b6" fill-opacity="0.55" />

  <!-- Top Reflective Shimmer Sheen Layer -->
  <rect width="512" height="512" fill="url(#reflect_top)" />

  <!-- Seamless Periodic Beach Wave Swells (Toroidal f(0,y) == f(512,y)) -->
  <!-- Wave Swell 1 (Upper Horizontal Rolling Swell) -->
  <path d="M 0 140 C 128 110, 256 165, 384 125 C 448 105, 480 125, 512 140 L 512 155 C 480 140, 448 120, 384 140 C 256 180, 128 125, 0 155 Z" fill="#ffffff" fill-opacity="0.20" />
  <path d="M 0 140 C 128 110, 256 165, 384 125 C 448 105, 480 125, 512 140" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.32" stroke-linecap="round" />

  <!-- Wave Swell 2 (Lower Horizontal Rolling Swell) -->
  <path d="M 0 380 C 128 350, 256 405, 384 365 C 448 345, 480 365, 512 380 L 512 395 C 480 380, 448 360, 384 380 C 256 420, 128 365, 0 395 Z" fill="#ffffff" fill-opacity="0.18" />
  <path d="M 0 380 C 128 350, 256 405, 384 365 C 448 345, 480 365, 512 380" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.28" stroke-linecap="round" />

  <!-- Gentle Sunlit Beach Ripple Accents (Tapered Refractive Glints) -->
  <path d="M 80 80 Q 140 68, 200 84 Q 140 88, 80 80 Z" fill="#ffffff" fill-opacity="0.22" />
  <path d="M 320 240 Q 390 226, 460 244 Q 390 248, 320 240 Z" fill="#ffffff" fill-opacity="0.20" />
  <path d="M 120 450 Q 190 436, 260 454 Q 190 458, 120 450 Z" fill="#ffffff" fill-opacity="0.18" />
</svg>
