<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft diffuse radial glow for caustic facet centers -->
    <radialGradient id="caustic_soft_1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="caustic_soft_2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Base Translucent Aquatic Surface (30% opacity for ultra-clear light water) -->
  <rect width="512" height="512" fill="#b0b0b0" fill-opacity="0.30" />

  <!-- Broad Soft Toroidal Wave Crests & Diffuse Refractive Facets -->
  <path d="M 0 160 C 128 110, 256 190, 384 140 C 448 115, 480 135, 512 160 L 512 210 C 480 185, 448 165, 384 190 C 256 240, 128 160, 0 210 Z" fill="url(#caustic_soft_1)" />
  <path d="M 0 390 C 128 340, 256 420, 384 370 C 448 345, 480 365, 512 390 L 512 440 C 480 415, 448 395, 384 420 C 256 470, 128 390, 0 440 Z" fill="url(#caustic_soft_2)" />

  <ellipse cx="160" cy="120" rx="90" ry="50" fill="url(#caustic_soft_1)" />
  <ellipse cx="400" cy="270" rx="100" ry="55" fill="url(#caustic_soft_2)" />
  <ellipse cx="200" cy="420" rx="95" ry="50" fill="url(#caustic_soft_1)" />
</svg>
