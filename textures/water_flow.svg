<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Soft Translucent Flowing Water (#b6b6b6 at 52% opacity) -->
  <rect width="512" height="512" fill="#b6b6b6" fill-opacity="0.52" />

  <!-- Smooth Directional Downstream Currents -->
  <g id="flow_currents" stroke="#c8c8c8" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M 96 0 C 96 128, 128 256, 96 512" />
    <path d="M 224 0 C 256 128, 192 256, 224 512" />
    <path d="M 352 0 C 336 128, 384 256, 352 512" />
    <path d="M 464 0 C 480 128, 448 256, 464 512" />
  </g>
</svg>
