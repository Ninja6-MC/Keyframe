<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: COAL ORE                                -->
  <!-- High-Visibility 3D Pop-Up Jet-Black Coal Nodules with Crisp Highlights     -->
  <!--                                                                           -->
  <!-- DERIVATIVE OF textures/block/stone.svg - READ BEFORE EDITING               -->
  <!-- The <defs> grooves below (including every corner radius rx) and the        -->
  <!-- <g id="stone_base"> group, whose first child is the full-canvas slate      -->
  <!-- fill, are a verbatim copy of that file and                                 -->
  <!-- must stay identical to it, or this ore stops blending into surrounding     -->
  <!-- stone in caves. Edit stone.svg first, then re-copy both sections here in   -->
  <!-- the same commit. The registry is tools/base-sync.json; tools/lib/base-sync.mjs -->
  <!-- enforces it - `npm run build` fails on drift and `npm test` covers it.     -->
  <!-- ========================================================================= -->

  <defs>
    <!-- 1x1 (32x32) Sunken Pop-Down Groove -->
    <g id="groove_32">
      <rect width="32" height="32" rx="8" fill="#5f6268" />
      <rect x="2" y="2" width="28" height="6" rx="3" fill="#3c3e44" />
      <rect x="2" y="2" width="4" height="14" rx="2" fill="#3c3e44" opacity="0.75" />
      <rect x="2" y="24" width="28" height="6" rx="3" fill="#a4a7ae" opacity="0.9" />
    </g>

    <!-- 2x1 (64x32) Sunken Pop-Down Groove -->
    <g id="groove_64">
      <rect width="64" height="32" rx="8" fill="#5f6268" />
      <rect x="2" y="2" width="60" height="6" rx="3" fill="#3c3e44" />
      <rect x="2" y="2" width="4" height="14" rx="2" fill="#3c3e44" opacity="0.75" />
      <rect x="2" y="24" width="60" height="6" rx="3" fill="#a4a7ae" opacity="0.9" />
    </g>

    <!-- 3x1 (96x32) Sunken Pop-Down Groove -->
    <g id="groove_96">
      <rect width="96" height="32" rx="8" fill="#5f6268" />
      <rect x="2" y="2" width="92" height="6" rx="3" fill="#3c3e44" />
      <rect x="2" y="2" width="4" height="14" rx="2" fill="#3c3e44" opacity="0.75" />
      <rect x="2" y="24" width="92" height="6" rx="3" fill="#a4a7ae" opacity="0.9" />
    </g>

    <!-- 4x1 (128x32) Sunken Pop-Down Groove -->
    <g id="groove_128">
      <rect width="128" height="32" rx="8" fill="#5f6268" />
      <rect x="2" y="2" width="124" height="6" rx="3" fill="#3c3e44" />
      <rect x="2" y="2" width="4" height="14" rx="2" fill="#3c3e44" opacity="0.75" />
      <rect x="2" y="24" width="124" height="6" rx="3" fill="#a4a7ae" opacity="0.9" />
    </g>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. STONE BASE - 1:1 Shared Base with stone.svg                            -->
  <!-- ========================================================================= -->
  <!-- The slate fill is the first child of this group rather than a loose sibling -->
  <!-- so it falls inside the shared section the base-sync check compares. Document -->
  <!-- order, and therefore paint order, is unchanged.                            -->
  <g id="stone_base">
    <!-- Authentic Neutral Minecraft Stone Base (#7e8187) -->
    <rect width="512" height="512" fill="#7e8187" />

    <!-- Row 1 (Top Area) -->
    <use href="#groove_128" x="64" y="32" />
    <use href="#groove_96" x="288" y="32" />
    <use href="#groove_32" x="416" y="64" />

    <!-- Row 2 (Upper Area) -->
    <use href="#groove_64" x="224" y="96" />

    <!-- Row 3 (Upper-Mid Area - Seamless Horizontal Wrap) -->
    <use href="#groove_96" x="480" y="128" />
    <use href="#groove_96" x="-32" y="128" />
    <use href="#groove_128" x="320" y="160" />

    <!-- Row 4 (Mid Area) -->
    <use href="#groove_64" x="96" y="224" />
    <use href="#groove_128" x="224" y="224" />
    <use href="#groove_32" x="32" y="256" />

    <!-- Row 5 (Mid-Lower Area - Seamless Horizontal Wrap) -->
    <use href="#groove_96" x="448" y="288" />
    <use href="#groove_96" x="-64" y="288" />

    <!-- Row 6 (Lower-Mid Area) -->
    <use href="#groove_128" x="64" y="352" />
    <use href="#groove_96" x="320" y="352" />
    <use href="#groove_64" x="288" y="416" />

    <!-- Row 7 (Bottom Area) -->
    <use href="#groove_96" x="32" y="448" />
    <use href="#groove_32" x="160" y="448" />
  </g>

  <!-- ========================================================================= -->
  <!-- 3. HIGH-VISIBILITY 3D POP-UP COAL ORE NODULES                            -->
  <!-- ========================================================================= -->
  <g id="coal-nodules">
    <!-- 3A. 3D Bottom Crevice Drop Shadows (Creates Pop-Up Relief over Stone) -->
    <g id="coal-drop-shadows" fill="#26282f" opacity="0.95">
      <!-- Cluster 1 -->
      <rect x="96" y="68" width="64" height="32" rx="6" />
      <rect x="64" y="100" width="64" height="32" rx="6" />

      <!-- Cluster 2 -->
      <rect x="352" y="36" width="32" height="32" rx="6" />
      <rect x="384" y="68" width="64" height="32" rx="6" />

      <!-- Cluster 3 -->
      <rect x="224" y="132" width="64" height="32" rx="6" />
      <rect x="160" y="164" width="96" height="32" rx="6" />
      <rect x="192" y="196" width="32" height="32" rx="6" />

      <!-- Cluster 4 -->
      <rect x="352" y="196" width="64" height="32" rx="6" />
      <rect x="384" y="228" width="64" height="32" rx="6" />

      <!-- Cluster 5 -->
      <rect x="64" y="228" width="64" height="32" rx="6" />
      <rect x="96" y="260" width="64" height="32" rx="6" />

      <!-- Cluster 6 -->
      <rect x="224" y="260" width="96" height="32" rx="6" />
      <rect x="192" y="292" width="96" height="32" rx="6" />
      <rect x="224" y="324" width="32" height="32" rx="6" />

      <!-- Cluster 7 -->
      <rect x="320" y="356" width="96" height="32" rx="6" />
      <rect x="352" y="388" width="96" height="32" rx="6" />

      <!-- Cluster 8 -->
      <rect x="64" y="356" width="32" height="32" rx="6" />
      <rect x="96" y="388" width="64" height="32" rx="6" />
      <rect x="64" y="420" width="64" height="32" rx="6" />
    </g>

    <!-- 3B. Jet-Black Charcoal Mineral Bodies (#181b22) -->
    <g id="coal-bodies" fill="#181b22">
      <!-- Cluster 1: Top-Left -->
      <rect x="96" y="64" width="64" height="32" rx="5" />
      <rect x="64" y="96" width="64" height="32" rx="5" />

      <!-- Cluster 2: Top-Right -->
      <rect x="352" y="32" width="32" height="32" rx="5" />
      <rect x="384" y="64" width="64" height="32" rx="5" />

      <!-- Cluster 3: Upper-Mid Hero Cluster -->
      <rect x="224" y="128" width="64" height="32" rx="5" />
      <rect x="160" y="160" width="96" height="32" rx="5" />
      <rect x="192" y="192" width="32" height="32" rx="5" />

      <!-- Cluster 4: Mid-Right -->
