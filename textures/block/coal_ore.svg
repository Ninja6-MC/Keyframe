      <!-- Cluster 1 -->
      <rect x="98" y="93" width="60" height="3" rx="1.5" />
      <rect x="157" y="66" width="3" height="30" rx="1.5" />
      <rect x="66" y="125" width="60" height="3" rx="1.5" />
      <rect x="125" y="98" width="3" height="30" rx="1.5" />

      <!-- Cluster 2 -->
      <rect x="354" y="61" width="28" height="3" rx="1.5" />
      <rect x="381" y="34" width="3" height="30" rx="1.5" />
      <rect x="386" y="93" width="60" height="3" rx="1.5" />
      <rect x="445" y="66" width="3" height="30" rx="1.5" />

      <!-- Cluster 3 -->
      <rect x="226" y="157" width="60" height="3" rx="1.5" />
      <rect x="285" y="130" width="3" height="30" rx="1.5" />
      <rect x="162" y="189" width="92" height="3" rx="1.5" />
      <rect x="253" y="162" width="3" height="30" rx="1.5" />
      <rect x="194" y="221" width="28" height="3" rx="1.5" />
      <rect x="221" y="194" width="3" height="30" rx="1.5" />

      <!-- Cluster 4 -->
      <rect x="354" y="221" width="60" height="3" rx="1.5" />
      <rect x="413" y="194" width="3" height="30" rx="1.5" />
      <rect x="386" y="253" width="60" height="3" rx="1.5" />
      <rect x="445" y="226" width="3" height="30" rx="1.5" />

      <!-- Cluster 5 -->
      <rect x="66" y="253" width="60" height="3" rx="1.5" />
      <rect x="125" y="226" width="3" height="30" rx="1.5" />
      <rect x="98" y="285" width="60" height="3" rx="1.5" />
      <rect x="157" y="258" width="3" height="30" rx="1.5" />

      <!-- Cluster 6 -->
      <rect x="226" y="285" width="92" height="3" rx="1.5" />
      <rect x="317" y="258" width="3" height="30" rx="1.5" />
      <rect x="194" y="317" width="92" height="3" rx="1.5" />
      <rect x="285" y="290" width="3" height="30" rx="1.5" />
      <rect x="226" y="349" width="28" height="3" rx="1.5" />
      <rect x="253" y="322" width="3" height="30" rx="1.5" />

      <!-- Cluster 7 -->
      <rect x="322" y="381" width="92" height="3" rx="1.5" />
      <rect x="413" y="354" width="3" height="30" rx="1.5" />
      <rect x="354" y="413" width="92" height="3" rx="1.5" />
      <rect x="445" y="386" width="3" height="30" rx="1.5" />

