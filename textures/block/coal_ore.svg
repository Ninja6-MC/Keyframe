      <rect x="93" y="354" width="3" height="30" rx="1.5" />
      <rect x="98" y="413" width="60" height="3" rx="1.5" />
      <rect x="157" y="386" width="3" height="30" rx="1.5" />
      <rect x="66" y="445" width="60" height="3" rx="1.5" />
      <rect x="125" y="418" width="3" height="30" rx="1.5" />
    </g>

    <!-- 3D. High-Visibility Crisp Mineral Bevel Highlights (#8e96a5) -->
    <g id="coal-highlight-bevels" fill="#8e96a5">
      <!-- Cluster 1 -->
      <rect x="98" y="66" width="60" height="4" rx="2" />
      <rect x="98" y="66" width="4" height="28" rx="2" />
      <rect x="66" y="98" width="60" height="4" rx="2" />
      <rect x="66" y="98" width="4" height="28" rx="2" />

      <!-- Cluster 2 -->
      <rect x="354" y="34" width="28" height="4" rx="2" />
      <rect x="354" y="34" width="4" height="28" rx="2" />
      <rect x="386" y="66" width="60" height="4" rx="2" />
      <rect x="386" y="66" width="4" height="28" rx="2" />

      <!-- Cluster 3 -->
      <rect x="226" y="130" width="60" height="4" rx="2" />
      <rect x="226" y="130" width="4" height="28" rx="2" />
      <rect x="162" y="162" width="92" height="4" rx="2" />
      <rect x="162" y="162" width="4" height="28" rx="2" />
      <rect x="194" y="194" width="28" height="4" rx="2" />
      <rect x="194" y="194" width="4" height="28" rx="2" />

      <!-- Cluster 4 -->
      <rect x="354" y="194" width="60" height="4" rx="2" />
      <rect x="354" y="194" width="4" height="28" rx="2" />
      <rect x="386" y="226" width="60" height="4" rx="2" />
      <rect x="386" y="226" width="4" height="28" rx="2" />

      <!-- Cluster 5 -->
      <rect x="66" y="226" width="60" height="4" rx="2" />
      <rect x="66" y="226" width="4" height="28" rx="2" />
      <rect x="98" y="258" width="60" height="4" rx="2" />
      <rect x="98" y="258" width="4" height="28" rx="2" />

      <!-- Cluster 6 -->
      <rect x="226" y="258" width="92" height="4" rx="2" />
      <rect x="226" y="258" width="4" height="28" rx="2" />
      <rect x="194" y="290" width="92" height="4" rx="2" />
      <rect x="194" y="290" width="4" height="28" rx="2" />
      <rect x="226" y="322" width="28" height="4" rx="2" />
      <rect x="226" y="322" width="4" height="28" rx="2" />

      <!-- Cluster 7 -->
