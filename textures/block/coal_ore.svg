      <rect x="66" y="354" width="4" height="28" rx="2" />
      <rect x="98" y="386" width="60" height="4" rx="2" />
      <rect x="98" y="386" width="4" height="28" rx="2" />
      <rect x="66" y="418" width="60" height="4" rx="2" />
      <rect x="66" y="418" width="4" height="28" rx="2" />
