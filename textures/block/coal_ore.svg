      <rect x="100" y="68" width="16" height="4" rx="2" />
      <rect x="68" y="100" width="16" height="4" rx="2" />
      <rect x="388" y="68" width="16" height="4" rx="2" />
      <rect x="228" y="132" width="16" height="4" rx="2" />
      <rect x="164" y="164" width="20" height="4" rx="2" />
      <rect x="356" y="196" width="16" height="4" rx="2" />
      <rect x="68" y="228" width="16" height="4" rx="2" />
      <rect x="228" y="260" width="20" height="4" rx="2" />
      <rect x="196" y="292" width="20" height="4" rx="2" />
      <rect x="324" y="356" width="20" height="4" rx="2" />
      <rect x="356" y="388" width="20" height="4" rx="2" />
