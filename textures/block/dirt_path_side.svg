<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- TRAILER STYLE: DIRT PATH SIDE                                             -->
  <!-- Stepped Bamboo Ochre Overhang (#cfa567) over #c77d38 soil with pebbles    -->
  <!-- ========================================================================= -->

  <!-- Matching Balanced Warm Umber Soil Base (#c77d38) -->
  <rect width="512" height="512" fill="#c77d38" />

  <!-- Soil Clods & Organic Earth Pebbles -->
  <rect x="48" y="220" width="72" height="56" rx="8" fill="#d59f62" />
  <rect x="60" y="232" width="40" height="28" rx="4" fill="#deae70" />

  <rect x="240" y="220" width="56" height="48" rx="6" fill="#a35f24" />
  <rect x="320" y="280" width="72" height="52" rx="6" fill="#d59f62" />
  <rect x="332" y="292" width="40" height="24" rx="3" fill="#deae70" />

  <rect x="140" y="340" width="128" height="72" rx="10" fill="#a35f24" />
  <rect x="156" y="356" width="64" height="36" rx="4" fill="#864a18" />

  <rect x="380" y="380" width="88" height="64" rx="8" fill="#a35f24" />
  <rect x="40" y="420" width="64" height="48" rx="6" fill="#d59f62" />

  <!-- ========================================================================= -->
  <!-- STYLIZED SLATE STONE PEBBLES (70% OPACITY - MATCHING GRASS SIDE & DIRT)   -->
  <!-- ========================================================================= -->
  <g id="stylized-stone-pebbles" opacity="0.7">
    <!-- Pebble 1 (Mid Left): Slate body + top bevel highlight + bottom shadow -->
    <rect x="110" y="260" width="30" height="22" rx="4" fill="#6f7887" />
    <path d="M 110 260 L 140 260 L 136 264 L 114 264 Z" fill="#9ba4b2" />
    <path d="M 110 282 L 140 282 L 136 278 L 114 278 Z" fill="#4d5562" />

    <!-- Pebble 2 (Upper Right) -->
    <rect x="360" y="220" width="24" height="18" rx="4" fill="#6f7887" />
    <path d="M 360 220 L 384 220 L 380 223 L 364 223 Z" fill="#9ba4b2" />
    <path d="M 360 238 L 384 238 L 380 235 L 364 235 Z" fill="#4d5562" />

    <!-- Pebble 3 (Lower Center) -->
    <rect x="220" y="410" width="32" height="24" rx="5" fill="#6f7887" />
    <path d="M 220 410 L 252 410 L 248 414 L 224 414 Z" fill="#9ba4b2" />
    <path d="M 220 434 L 252 434 L 248 430 L 224 430 Z" fill="#4d5562" />

    <!-- Pebble 4 (Lower Right) -->
    <rect x="420" y="440" width="22" height="16" rx="4" fill="#6f7887" />
    <path d="M 420 440 L 442 440 L 439 443 L 423 443 Z" fill="#9ba4b2" />
  </g>

  <!-- ========================================================================= -->
  <!-- STEPPED BAMBOO OCHRE PATH OVERHANG (Matching Grass Side Pattern 1:1)      -->
  <!-- ========================================================================= -->
  <path d="M 0 0 L 512 0 L 512 80 
           L 464 80 L 464 128 L 416 128 L 416 88 
           L 368 88 L 368 144 L 304 144 L 304 80 
           L 240 80 L 240 120 L 192 120 L 192 80 
           L 144 80 L 144 136 L 80 136 L 80 80 
           L 0 80 Z" fill="#cfa567" />
</svg>
