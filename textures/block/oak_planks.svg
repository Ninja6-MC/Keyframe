<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: OAK PLANKS                              -->
  <!-- User-Approved Knot Layout with Official Bare Bones Palette                -->
  <!-- ========================================================================= -->

  <!-- Base Warm Golden Oak Planks (Bare Bones Base #b8945f) -->
  <rect width="512" height="512" fill="#b8945f" />

  <!-- ========================================================================= -->
  <!-- WOOD KNOTS & GRAIN ACCENTS (Bare Bones Accent #967441)                    -->
  <!-- ========================================================================= -->
  <g id="plank-knots-and-accents" fill="#967441">
    <!-- Plank 1 Accents (Y = 16..112) -->
    <rect x="96" y="48" width="32" height="32" />
    <rect x="256" y="80" width="32" height="32" />
    <rect x="-16" y="16" width="32" height="96" />
    <rect x="496" y="16" width="32" height="96" />

    <!-- Plank 2 Accents (Y = 144..240) -->
    <rect x="64" y="176" width="32" height="32" />
    <rect x="224" y="144" width="32" height="96" />
    <rect x="320" y="208" width="32" height="32" />
    <rect x="352" y="144" width="32" height="32" />

    <!-- Plank 3 Accents (Y = 272..368) -->
    <rect x="160" y="272" width="32" height="32" />
    <rect x="192" y="336" width="32" height="32" />
    <rect x="352" y="304" width="32" height="32" />
    <rect x="-16" y="272" width="32" height="96" />
    <rect x="496" y="272" width="32" height="96" />

    <!-- Plank 4 Accents (Y = 400..496) -->
    <rect x="64" y="432" width="32" height="32" />
    <rect x="224" y="400" width="32" height="96" />
    <rect x="288" y="400" width="32" height="32" />
  </g>

  <!-- ========================================================================= -->
  <!-- DARK HORIZONTAL SEAMS (Bare Bones Groove #67502c, 1 texel = 32px height)  -->
  <!-- ========================================================================= -->
  <g id="plank-grooves" fill="#67502c">
    <!-- Boundary Groove (Top/Bottom Y=0/512 wrap) -->
    <rect x="0" y="-16" width="512" height="32" />
    <rect x="0" y="496" width="512" height="32" />

    <!-- Groove 1 (Y = 112..144) -->
    <rect x="0" y="112" width="512" height="32" />

    <!-- Groove 2 (Y = 240..272) -->
    <rect x="0" y="240" width="512" height="32" />

    <!-- Groove 3 (Y = 368..400) -->
    <rect x="0" y="368" width="512" height="32" />
  </g>
</svg>
