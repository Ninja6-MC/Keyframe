<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: ROOTED DIRT                             -->
  <!-- Cinematic Warm Loam soil embedded with 3D geometric trailer azalea roots   -->
  <!-- ========================================================================= -->

  <defs>
    <!-- 1x1 Root Joint Node (32x32) -->
    <g id="rj_32">
      <rect y="29" width="32" height="3" fill="#3d210c" />
      <rect x="29" width="3" height="32" fill="#3d210c" />
      <rect width="29" height="29" rx="4" fill="#bb9789" />
      <rect width="29" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="29" rx="2" fill="#dbc0b4" />
      <rect x="8" y="8" width="13" height="13" rx="2" fill="#9e7968" />
    </g>

    <!-- 1x1 Root Tip / Terminal (32x32) -->
    <g id="rt_32">
      <rect y="29" width="32" height="3" fill="#3d210c" />
      <rect x="29" width="3" height="32" fill="#3d210c" />
      <rect width="29" height="29" rx="4" fill="#bb9789" />
      <rect width="29" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="29" rx="2" fill="#dbc0b4" />
    </g>

    <!-- 2x1 Horizontal Root Strand (64x32) -->
    <g id="rh_64">
      <rect y="29" width="64" height="3" fill="#3d210c" />
      <rect x="61" width="3" height="32" fill="#3d210c" />
      <rect width="61" height="29" rx="4" fill="#bb9789" />
      <rect width="61" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="29" rx="2" fill="#dbc0b4" />
      <rect x="18" y="9" width="25" height="11" rx="2" fill="#9e7968" />
    </g>

    <!-- 4x1 Horizontal Cross-Root Strand (128x32) -->
    <g id="rh_128">
      <rect y="29" width="128" height="3" fill="#3d210c" />
      <rect x="125" width="3" height="32" fill="#3d210c" />
      <rect width="125" height="29" rx="4" fill="#bb9789" />
      <rect width="125" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="29" rx="2" fill="#dbc0b4" />
      <rect x="32" y="9" width="60" height="11" rx="2" fill="#9e7968" />
    </g>

    <!-- 1x2 Vertical Root Strand (32x64) -->
    <g id="rv_64">
      <rect y="61" width="32" height="3" fill="#3d210c" />
      <rect x="29" width="3" height="64" fill="#3d210c" />
      <rect width="29" height="61" rx="4" fill="#bb9789" />
      <rect width="29" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="61" rx="2" fill="#dbc0b4" />
      <rect x="9" y="18" width="11" height="25" rx="2" fill="#9e7968" />
    </g>

    <!-- 1x3 Vertical Root Strand (32x96) -->
    <g id="rv_96">
      <rect y="93" width="32" height="3" fill="#3d210c" />
      <rect x="29" width="3" height="96" fill="#3d210c" />
      <rect width="29" height="93" rx="4" fill="#bb9789" />
      <rect width="29" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="93" rx="2" fill="#dbc0b4" />
      <rect x="9" y="24" width="11" height="45" rx="2" fill="#9e7968" />
    </g>

    <!-- 1x4 Vertical Taproot Strand (32x128) -->
    <g id="rv_128">
      <rect y="125" width="32" height="3" fill="#3d210c" />
      <rect x="29" width="3" height="128" fill="#3d210c" />
      <rect width="29" height="125" rx="4" fill="#bb9789" />
      <rect width="29" height="3" rx="2" fill="#dbc0b4" />
      <rect width="3" height="125" rx="2" fill="#dbc0b4" />
      <rect x="9" y="32" width="11" height="60" rx="2" fill="#9e7968" />
    </g>
  </defs>

  <!-- 1. Cinematic Warm Loam Soil Base (#996b36) -->
  <rect width="512" height="512" fill="#996b36" />

  <!-- 2. Soil Clods (Toroidal Seamless Substrate) -->
  <rect x="48" y="32" width="96" height="64" rx="8" fill="#7a5225" />
  <rect x="56" y="40" width="48" height="32" rx="4" fill="#603e18" />

  <rect x="320" y="120" width="112" height="80" rx="10" fill="#7a5225" />
  <rect x="336" y="136" width="64" height="40" rx="6" fill="#603e18" />

  <rect x="140" y="340" width="128" height="72" rx="10" fill="#7a5225" />
  <rect x="156" y="356" width="64" height="36" rx="4" fill="#603e18" />

  <rect x="380" y="380" width="88" height="64" rx="8" fill="#7a5225" />

  <!-- 3. Warm Sunlit Soil Swells -->
  <rect x="220" y="48" width="64" height="48" rx="6" fill="#bc8843" />
  <rect x="232" y="56" width="32" height="24" rx="3" fill="#c89651" />

  <rect x="48" y="220" width="72" height="56" rx="8" fill="#bc8843" />
  <rect x="60" y="232" width="40" height="28" rx="4" fill="#c89651" />

  <rect x="240" y="220" width="56" height="48" rx="6" fill="#7a5225" />

  <rect x="320" y="280" width="72" height="52" rx="6" fill="#bc8843" />
  <rect x="332" y="292" width="40" height="24" rx="3" fill="#c89651" />

  <rect x="40" y="420" width="64" height="48" rx="6" fill="#bc8843" />

  <!-- 4. Stylized Slate Stone Pebbles (70% Opacity) -->
  <g id="stylized-stone-pebbles" opacity="0.7">
    <rect x="180" y="100" width="28" height="20" rx="4" fill="#6f7887" />
    <path d="M 180 100 L 208 100 L 204 103 L 184 103 Z" fill="#9ba4b2" />
    <path d="M 180 120 L 208 120 L 204 117 L 184 117 Z" fill="#4d5562" />

    <rect x="110" y="260" width="30" height="22" rx="4" fill="#6f7887" />
    <path d="M 110 260 L 140 260 L 136 264 L 114 264 Z" fill="#9ba4b2" />
    <path d="M 110 282 L 140 282 L 136 278 L 114 278 Z" fill="#4d5562" />

    <rect x="360" y="220" width="24" height="18" rx="4" fill="#6f7887" />
    <path d="M 360 220 L 384 220 L 380 223 L 364 223 Z" fill="#9ba4b2" />
    <path d="M 360 238 L 384 238 L 380 235 L 364 235 Z" fill="#4d5562" />

    <rect x="220" y="410" width="32" height="24" rx="5" fill="#6f7887" />
    <path d="M 220 410 L 252 410 L 248 414 L 224 414 Z" fill="#9ba4b2" />
    <path d="M 220 434 L 252 434 L 248 430 L 224 430 Z" fill="#4d5562" />

    <rect x="420" y="440" width="22" height="16" rx="4" fill="#6f7887" />
    <path d="M 420 440 L 442 440 L 439 443 L 423 443 Z" fill="#9ba4b2" />
  </g>

  <!-- ========================================================================= -->
  <!-- 5. 3D GEOMETRIC AZALEA ROOT NETWORK (OFFICIAL MINECRAFT TRAILER STYLE)    -->
  <!-- ========================================================================= -->
  <g id="geometric_roots">
    <!-- Top Taproot Entry (Toroidal Y-wrap: X=288, Y=-16 and Y=496) -->
    <use href="#rj_32" x="288" y="-16" />
    <use href="#rj_32" x="288" y="496" />

    <!-- Top-Right Descent -->
    <use href="#rj_32" x="320" y="32" />
    <use href="#rv_64" x="352" y="64" />
    <use href="#rh_64" x="384" y="32" />
    <use href="#rt_32" x="448" y="64" />

    <!-- Upper-Middle Branch -->
    <use href="#rt_32" x="192" y="64" />
    <use href="#rt_32" x="192" y="96" />
    <use href="#rv_96" x="224" y="96" />

    <!-- Center-Left Taproot -->
    <use href="#rt_32" x="64" y="32" />
    <use href="#rt_32" x="96" y="96" />
    <use href="#rv_128" x="128" y="128" />
    <use href="#rv_64" x="160" y="256" />

    <!-- Left-to-Right Edge Wrap (Toroidal X-wrap: X=-16 and X=496 at Y=192) -->
    <use href="#rt_32" x="-16" y="192" />
    <use href="#rt_32" x="496" y="192" />

    <!-- Side Branch from Left Wrap -->
    <use href="#rt_32" x="32" y="224" />
    <use href="#rv_96" x="64" y="256" />

    <!-- Lower Horizontal Cross-Root -->
    <use href="#rj_32" x="192" y="320" />
    <use href="#rh_128" x="192" y="352" />
    <use href="#rv_64" x="192" y="384" />
    <use href="#rt_32" x="224" y="416" />

    <!-- Scattered Feeder Nodes & Lower Anchors -->
    <use href="#rt_32" x="352" y="288" />
    <use href="#rt_32" x="320" y="416" />
    <use href="#rt_32" x="416" y="416" />
    <use href="#rt_32" x="32" y="448" />
    <use href="#rt_32" x="448" y="448" />
  </g>
</svg>
