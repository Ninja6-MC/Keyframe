  </g>

  <!-- ========================================================================= -->
  <!-- 6. CRISP SPECULAR DIAMOND SHINE SPARKS (#ffffff at 90% Opacity)           -->
  <!-- ========================================================================= -->
  <g id="diamond-specular-shine" fill="#ffffff" opacity="0.9">
    <!-- Top-Left Spark -->
    <rect x="132" y="68" width="14" height="4" rx="2" />

    <!-- Top-Center-Right -->
    <rect x="228" y="100" width="16" height="4" rx="2" />

    <!-- Top-Right -->
    <rect x="388" y="68" width="16" height="4" rx="2" />

    <!-- Upper-Mid Hero Gem Top Cap -->
    <rect x="164" y="164" width="18" height="4" rx="2" />

    <!-- Upper-Mid Left -->
    <rect x="100" y="196" width="14" height="4" rx="2" />

    <!-- Upper-Mid Right Top -->
    <rect x="324" y="164" width="16" height="4" rx="2" />

    <!-- Mid-Left -->
    <rect x="36" y="260" width="16" height="4" rx="2" />

    <!-- Center Top -->
    <rect x="260" y="260" width="16" height="4" rx="2" />

    <!-- Center Left -->
    <rect x="228" y="292" width="14" height="4" rx="2" />

    <!-- Lower-Left Accent Spark -->
