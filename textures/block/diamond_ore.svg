      <!-- Gem 4 (128, 320) -->
      <rect x="130" y="349" width="28" height="3" rx="1.5" />
      <rect x="157" y="322" width="3" height="30" rx="1.5" />

      <!-- Gem 5 (416, 352) -->
      <rect x="418" y="381" width="28" height="3" rx="1.5" />
      <rect x="445" y="354" width="3" height="30" rx="1.5" />

      <!-- Gem 6 (352, 384) -->
      <rect x="354" y="413" width="92" height="3" rx="1.5" />
      <rect x="445" y="386" width="3" height="30" rx="1.5" />

      <!-- Gem 7 (288, 416) -->
      <rect x="290" y="445" width="60" height="3" rx="1.5" />
      <rect x="349" y="418" width="3" height="30" rx="1.5" />
    </g>

    <!-- 4C. Top-Left Inner Teal Highlight Bevels (#4eebd9) -->
    <g id="deep-teal-highlight-bevels" fill="#4eebd9">
      <!-- Gem 1 (160, 192) -->
      <rect x="162" y="194" width="92" height="4" rx="2" />
      <rect x="162" y="194" width="4" height="28" rx="2" />

      <!-- Gem 2 (320, 192) -->
      <rect x="322" y="194" width="60" height="4" rx="2" />
      <rect x="322" y="194" width="4" height="28" rx="2" />

      <!-- Gem 3 (288, 288) -->
      <rect x="290" y="290" width="60" height="4" rx="2" />
      <rect x="290" y="290" width="4" height="28" rx="2" />

      <!-- Gem 4 (128, 320) -->
      <rect x="130" y="322" width="28" height="4" rx="2" />
      <rect x="130" y="322" width="4" height="28" rx="2" />

      <!-- Gem 5 (416, 352) -->
      <rect x="418" y="354" width="28" height="4" rx="2" />
      <rect x="418" y="354" width="4" height="28" rx="2" />

      <!-- Gem 6 (352, 384) -->
      <rect x="354" y="386" width="92" height="4" rx="2" />
      <rect x="354" y="386" width="4" height="28" rx="2" />

      <!-- Gem 7 (288, 416) -->
      <rect x="290" y="418" width="60" height="4" rx="2" />
      <rect x="290" y="418" width="4" height="28" rx="2" />
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. RADIANT LIGHT CYAN DIAMOND CRYSTALS                                    -->
  <!-- ========================================================================= -->
  <g id="diamond-light-cyan">
    <!-- 5A. Base Radiant Bodies (#2ee2d2) -->
    <g id="light-cyan-bodies" fill="#2ee2d2">
      <rect x="128" y="64" width="32" height="32" rx="5" />
      <rect x="224" y="96" width="64" height="32" rx="5" />
      <rect x="384" y="64" width="64" height="32" rx="5" />
      <rect x="160" y="160" width="64" height="32" rx="5" />
      <rect x="96" y="192" width="64" height="32" rx="5" />
      <rect x="320" y="160" width="64" height="32" rx="5" />
      <rect x="32" y="256" width="64" height="32" rx="5" />
      <rect x="256" y="256" width="64" height="32" rx="5" />
      <rect x="224" y="288" width="64" height="32" rx="5" />
      <rect x="352" y="352" width="64" height="32" rx="5" />
      <rect x="256" y="384" width="96" height="32" rx="5" />
      <rect x="96" y="416" width="64" height="32" rx="5" />
    </g>

    <!-- 5B. Bottom-Right Inner Cyan Shadows (#149e91) -->
    <g id="light-cyan-shadow-bevels" fill="#149e91">
      <!-- Gem 1 (128, 64) -->
      <rect x="130" y="93" width="28" height="3" rx="1.5" />
      <rect x="157" y="66" width="3" height="30" rx="1.5" />

      <!-- Gem 2 (224, 96) -->
      <rect x="226" y="125" width="60" height="3" rx="1.5" />
      <rect x="285" y="98" width="3" height="30" rx="1.5" />

      <!-- Gem 3 (384, 64) -->
      <rect x="386" y="93" width="60" height="3" rx="1.5" />
      <rect x="445" y="66" width="3" height="30" rx="1.5" />

      <!-- Gem 4 (160, 160) -->
      <rect x="162" y="189" width="60" height="3" rx="1.5" />
      <rect x="221" y="162" width="3" height="30" rx="1.5" />

      <!-- Gem 5 (96, 192) -->
      <rect x="98" y="221" width="60" height="3" rx="1.5" />
      <rect x="157" y="194" width="3" height="30" rx="1.5" />

      <!-- Gem 6 (320, 160) -->
      <rect x="322" y="189" width="60" height="3" rx="1.5" />
      <rect x="381" y="162" width="3" height="30" rx="1.5" />

      <!-- Gem 7 (32, 256) -->
      <rect x="34" y="285" width="60" height="3" rx="1.5" />
      <rect x="93" y="258" width="3" height="30" rx="1.5" />

      <!-- Gem 8 (256, 256) -->
      <rect x="258" y="285" width="60" height="3" rx="1.5" />
      <rect x="317" y="258" width="3" height="30" rx="1.5" />

      <!-- Gem 9 (224, 288) -->
      <rect x="226" y="317" width="60" height="3" rx="1.5" />
      <rect x="285" y="290" width="3" height="30" rx="1.5" />

      <!-- Gem 10 (352, 352) -->
      <rect x="354" y="381" width="60" height="3" rx="1.5" />
      <rect x="413" y="354" width="3" height="30" rx="1.5" />

      <!-- Gem 11 (256, 384) -->
      <rect x="258" y="413" width="92" height="3" rx="1.5" />
      <rect x="349" y="386" width="3" height="30" rx="1.5" />

      <!-- Gem 12 (96, 416) -->
      <rect x="98" y="445" width="60" height="3" rx="1.5" />
      <rect x="157" y="418" width="3" height="30" rx="1.5" />
    </g>

    <!-- 5C. Crisp Sunlit Highlight Bevels (#cafffa) -->
    <g id="light-cyan-highlight-bevels" fill="#cafffa">
      <!-- Gem 1 (128, 64) -->
      <rect x="130" y="66" width="28" height="4" rx="2" />
      <rect x="130" y="66" width="4" height="28" rx="2" />

      <!-- Gem 2 (224, 96) -->
      <rect x="226" y="98" width="60" height="4" rx="2" />
      <rect x="226" y="98" width="4" height="28" rx="2" />

      <!-- Gem 3 (384, 64) -->
      <rect x="386" y="66" width="60" height="4" rx="2" />
      <rect x="386" y="66" width="4" height="28" rx="2" />

      <!-- Gem 4 (160, 160) -->
      <rect x="162" y="162" width="60" height="4" rx="2" />
      <rect x="162" y="162" width="4" height="28" rx="2" />

      <!-- Gem 5 (96, 192) -->
      <rect x="98" y="194" width="60" height="4" rx="2" />
      <rect x="98" y="194" width="4" height="28" rx="2" />

      <!-- Gem 6 (320, 160) -->
      <rect x="322" y="162" width="60" height="4" rx="2" />
      <rect x="322" y="162" width="4" height="28" rx="2" />

      <!-- Gem 7 (32, 256) -->
      <rect x="34" y="258" width="60" height="4" rx="2" />
      <rect x="34" y="258" width="4" height="28" rx="2" />

      <!-- Gem 8 (256, 256) -->
      <rect x="258" y="258" width="60" height="4" rx="2" />
      <rect x="258" y="258" width="4" height="28" rx="2" />

      <!-- Gem 9 (224, 288) -->
      <rect x="226" y="290" width="60" height="4" rx="2" />
      <rect x="226" y="290" width="4" height="28" rx="2" />

      <!-- Gem 10 (352, 352) -->
      <rect x="354" y="354" width="60" height="4" rx="2" />
      <rect x="354" y="354" width="4" height="28" rx="2" />

      <!-- Gem 11 (256, 384) -->
