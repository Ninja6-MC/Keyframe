  <use href="#p2h_med" x="480" y="64" />

  <use href="#p1_light" x="-16" y="160" />
  <use href="#p1_light" x="496" y="160" />

  <use href="#p2v_dark" x="-16" y="224" />
  <use href="#p2v_dark" x="496" y="224" />

