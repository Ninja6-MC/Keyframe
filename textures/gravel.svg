<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 512 512" width="512" height="512">
  <!-- ========================================================================= -->
  <!-- OFFICIAL MINECRAFT TRAILER STYLE: ORGANIC CHAOTIC GRAVEL                   -->
  <!-- Balanced high-density interlocking slate pebbles, river stones, & crevices -->
  <!-- ========================================================================= -->

  <defs>
    <!-- ==================== 1x1 PEBBLES (32x32) ==================== -->
    <g id="p1_light" shape-rendering="crispEdges">
      <rect y="29" width="32" height="3" fill="#46424a" />
      <rect x="29" width="3" height="32" fill="#46424a" />
      <rect width="29" height="29" fill="#bab6c4" />
      <rect width="29" height="3" fill="#dedae8" />
      <rect width="3" height="29" fill="#dedae8" />
    </g>

    <g id="p1_med" shape-rendering="crispEdges">
      <rect y="29" width="32" height="3" fill="#46424a" />
      <rect x="29" width="3" height="32" fill="#46424a" />
      <rect width="29" height="29" fill="#6c6876" />
      <rect width="29" height="3" fill="#8c8898" />
      <rect width="3" height="29" fill="#8c8898" />
    </g>

    <g id="p1_dark" shape-rendering="crispEdges">
      <rect width="32" height="32" fill="#46424a" />
      <rect width="32" height="3" fill="#302d34" />
      <rect width="3" height="32" fill="#302d34" />
      <rect y="29" width="32" height="3" fill="#6c6876" />
      <rect x="29" width="3" height="32" fill="#6c6876" />
    </g>

    <!-- ==================== 2x1 HORIZONTAL STONES (64x32) ==================== -->
    <g id="p2h_light" shape-rendering="crispEdges">
      <rect y="29" width="64" height="3" fill="#46424a" />
      <rect x="61" width="3" height="32" fill="#46424a" />
      <rect width="61" height="29" fill="#bab6c4" />
      <rect width="61" height="3" fill="#dedae8" />
      <rect width="3" height="29" fill="#dedae8" />
    </g>

    <g id="p2h_med" shape-rendering="crispEdges">
      <rect y="29" width="64" height="3" fill="#46424a" />
      <rect x="61" width="3" height="32" fill="#46424a" />
      <rect width="61" height="29" fill="#6c6876" />
      <rect width="61" height="3" fill="#8c8898" />
      <rect width="3" height="29" fill="#8c8898" />
    </g>

    <g id="p2h_dark" shape-rendering="crispEdges">
      <rect width="64" height="32" fill="#46424a" />
      <rect width="64" height="3" fill="#302d34" />
