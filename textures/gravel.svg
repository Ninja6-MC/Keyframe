  <use href="#p1_light" x="160" y="448" />
  <use href="#p2v_light" x="256" y="416" />
  <use href="#p1_light" x="384" y="448" />

  <!-- 5. Micro Mineral Chips -->
  <use href="#p_micro_light" x="16" y="64" />
  <use href="#p_micro_dark" x="112" y="16" />
  <use href="#p_micro_light" x="272" y="16" />
