    <!-- ==================== 1x2 VERTICAL STONES (32x64) ==================== -->
    <g id="p2v_light" shape-rendering="crispEdges">
      <rect y="61" width="32" height="3" fill="#46424a" />
      <rect x="29" width="3" height="64" fill="#46424a" />
      <rect width="29" height="61" fill="#bab6c4" />
      <rect width="29" height="3" fill="#dedae8" />
      <rect width="3" height="61" fill="#dedae8" />
    </g>

    <g id="p2v_med" shape-rendering="crispEdges">
      <rect y="61" width="32" height="3" fill="#46424a" />
      <rect x="29" width="3" height="64" fill="#46424a" />
      <rect width="29" height="61" fill="#6c6876" />
      <rect width="29" height="3" fill="#8c8898" />
      <rect width="3" height="61" fill="#8c8898" />
    </g>

    <g id="p2v_dark" shape-rendering="crispEdges">
      <rect width="32" height="64" fill="#46424a" />
      <rect width="32" height="3" fill="#302d34" />
      <rect width="3" height="64" fill="#302d34" />
      <rect y="61" width="32" height="3" fill="#6c6876" />
      <rect x="29" width="3" height="64" fill="#6c6876" />
    </g>

    <!-- ==================== MICRO ACCENTS (16x16) ==================== -->
    <g id="p_micro_light" shape-rendering="crispEdges">
      <rect y="14" width="16" height="2" fill="#46424a" />
      <rect x="14" width="2" height="16" fill="#46424a" />
      <rect width="14" height="14" fill="#bab6c4" />
      <rect width="14" height="2" fill="#dedae8" />
      <rect width="2" height="14" fill="#dedae8" />
    </g>

    <g id="p_micro_dark" shape-rendering="crispEdges">
      <rect width="16" height="16" fill="#46424a" />
      <rect width="16" height="2" fill="#302d34" />
      <rect width="2" height="16" fill="#302d34" />
      <rect y="14" width="16" height="2" fill="#6c6876" />
      <rect x="14" width="2" height="16" fill="#6c6876" />
    </g>
