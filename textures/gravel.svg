  <use href="#p2v_dark" x="224" y="32" />
  <use href="#p1_dark" x="384" y="32" />

  <use href="#p2h_dark" x="128" y="96" />
  <use href="#p1_dark" x="320" y="96" />
  <use href="#p2v_dark" x="448" y="64" />

  <use href="#p1_dark" x="32" y="192" />
  <use href="#p2h_dark" x="160" y="160" />
  <use href="#p1_dark" x="288" y="192" />
  <use href="#p2h_dark" x="384" y="192" />

  <use href="#p2v_dark" x="96" y="256" />
  <use href="#p1_dark" x="224" y="256" />
  <use href="#p2h_dark" x="320" y="288" />
  <use href="#p1_dark" x="448" y="256" />

