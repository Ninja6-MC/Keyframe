# Third-party actions are pinned to commit SHAs, not tags: a tag can be repointed at new
# code with no diff, no review and no notification. This workflow holds `contents: write`
# and publishes the zips users download, so it is the one that matters most.
#
# The pin goes stale in silence, so .github/dependabot.yml is the other half of the trade.
# Do not add a pin here without checking that file still covers this workflow.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default. The one job that needs to write does so explicitly below; on a
# normal (non-reusable) run a job's `permissions:` REPLACES this rather than being capped
# by it, so narrowing here costs the release step nothing.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads the pack zips
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here does an authenticated git operation, so the token does not need
          # to be left behind in .git/config for later steps or actions to find.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Multi-Resolution Resource Packs
        run: node tools/build.mjs --all

      # The tier is derived from the tag rather than chosen by hand. Any SemVer
      # pre-release suffix - the hyphen in v0.1.0-alpha.1 - makes it a pre-release, which
      # is what stops an alpha appearing as the download a casual visitor gets.
      - name: Derive Version And Channel
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          {
            echo "version=$VERSION"
            echo "baseVersion=$BASE_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # A stable release tagged while CHANGELOG.md still says only [Unreleased] would
      # otherwise publish five zips with no record of what changed and nobody noticing.
      # Pre-releases may ship without a section; a stable release may not.
      - name: Check Changelog And Collect Release Notes
        id: notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BASE_VERSION: ${{ steps.vars.outputs.baseVersion }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          extract() {
            awk -v header="## [$1]" '
              index($0, header) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }

          # An exact pre-release heading wins if one exists, otherwise the heading for the
          # version being worked towards.
          NOTES="$(extract "$VERSION")"
          [ -z "${NOTES//[[:space:]]/}" ] && NOTES="$(extract "$BASE_VERSION")"

          if [ -z "${NOTES//[[:space:]]/}" ]; then
            if [ "$PRERELEASE" != "true" ]; then
              echo "CHANGELOG.md has no '## [$BASE_VERSION]' section."
              echo
              echo "A stable release must document what changed. Move the [Unreleased]"
              echo "entries under a '## [$BASE_VERSION]' heading, merge that to main,"
              echo "and re-tag. See RELEASE_PROCESS.md section 3."
              exit 1
            fi
            echo "No changelog section for $VERSION; pre-releases may ship without one."
            NOTES="Pre-release. See CHANGELOG.md [Unreleased] for work in progress."
          fi

          {
            echo "body<<KEYFRAME_NOTES_EOF"
            echo "$NOTES"
            echo "KEYFRAME_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Attach Resource Packs
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Keyframe-512x.zip
            dist/Keyframe-256x.zip
            dist/Keyframe-128x.zip
            dist/Keyframe-64x.zip
            dist/Keyframe-32x.zip
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          # Appended below the changelog body above, not instead of it.
          generate_release_notes: true
