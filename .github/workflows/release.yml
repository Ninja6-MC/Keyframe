# Third-party actions are pinned to commit SHAs, not tags: a tag can be repointed at new
# code with no diff, no review and no notification. This workflow holds `contents: write`
# and publishes the zips users download, so it is the one that matters most.
#
# The pin goes stale in silence, so .github/dependabot.yml is the other half of the trade.
# Do not add a pin here without checking that file still covers this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate or promote an existing candidate
        required: true
        type: choice
        options: [candidate, promote]
      tag:
        description: Intended v0.x.y tag
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate run ID (promotion only)
        required: false
        type: string
      candidate_run_attempt:
        description: Candidate attempt number (promotion only)
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: inputs.operation == 'candidate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r tools/requirements-release.txt
      - run: node tools/build.mjs --all
      - name: Record candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release.py manifest dist "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyframe-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Keyframe-*.zip
            dist/candidate.json
          if-no-files-found: error
          retention-days: 30
  verify:
    if: inputs.operation == 'candidate' && github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r tools/requirements-release.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keyframe-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Check downloaded packs before tests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release.py validate candidate "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Test downloaded candidate bytes
        env:
          KEYFRAME_CANDIDATE_DIR: candidate
        run: python3 tools/test/release.test.py
      - run: npm test
      - name: Bind passing tests to downloaded bytes
        run: python3 tools/release.py evidence candidate evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyframe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
  publish:
    if: inputs.operation == 'promote' && startsWith(github.ref, 'refs/tags/v') && inputs.tag == github.ref_name
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: keyframe-candidate-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: keyframe-evidence-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: evidence
      - run: python3 -m pip install -r tools/requirements-release.txt
      - name: Recheck candidate and publish exact packs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python3 tools/release.py publish candidate evidence "$RELEASE_TAG" "$GITHUB_SHA" "$CANDIDATE_RUN_ID"
